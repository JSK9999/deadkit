name: 'deadkit'
description: 'Find dead rules and unused skills in your AI coding setup'
branding:
  icon: 'search'
  color: 'red'

inputs:
  paths:
    description: 'Paths to scan (space-separated)'
    required: false
    default: ''
  token:
    description: 'GitHub token for PR comments'
    required: false
    default: ${{ github.token }}

outputs:
  issues:
    description: 'Number of issues found'
    value: ${{ steps.run.outputs.issues }}
  report:
    description: 'JSON report'
    value: ${{ steps.run.outputs.report }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run deadkit
      id: run
      shell: bash
      run: |
        REPORT=$(npx deadkit@latest ${{ inputs.paths }} --json 2>/dev/null || true)
        ISSUES=$(echo "$REPORT" | node -e "
          let d='';process.stdin.on('data',c=>d+=c);
          process.stdin.on('end',()=>{
            try{console.log(JSON.parse(d).issueCount||0)}
            catch{console.log(0)}
          })
        ")
        echo "issues=$ISSUES" >> $GITHUB_OUTPUT
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "report<<$EOF" >> $GITHUB_OUTPUT
        echo "$REPORT" >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT

    - name: Comment on PR
      if: github.event_name == 'pull_request' && steps.run.outputs.issues != '0'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const report = JSON.parse(process.env.REPORT);
          const lines = ['## deadkit report', ''];

          const skills = report.skills?.totalSkills || 0;
          const ruleInfo = `**${report.totalFiles}** rules` + (skills > 0 ? `, **${skills}** skills` : '');
          lines.push(`${ruleInfo} scanned, **~${report.totalTokens.toLocaleString()}** tokens (${(report.totalTokens / 200000 * 100).toFixed(1)}% of context)`);
          lines.push('');

          if (report.skills?.neverUsed?.length > 0) {
            lines.push(`### ${report.skills.neverUsed.length} unused skill(s)`);
            for (const s of report.skills.neverUsed.slice(0, 10)) {
              lines.push(`- \`/${s.name}\` — never called`);
            }
            lines.push('');
          }

          if (report.usage?.deadRules?.length > 0) {
            lines.push(`### ${report.usage.deadRules.length} dead rule(s)`);
            for (const d of report.usage.deadRules.slice(0, 10)) {
              lines.push(`- \`${d.file}\` — ${d.reason}`);
            }
            if (report.usage.deadRules.length > 10) {
              lines.push(`- ... and ${report.usage.deadRules.length - 10} more`);
            }
            lines.push('');
          }

          if (report.duplicates?.length > 0) {
            lines.push(`### ${report.duplicates.length} duplicate(s)`);
            for (const d of report.duplicates.slice(0, 5)) {
              lines.push(`- \`${d.fileA}\` <-> \`${d.fileB}\` (${d.similarity}%)`);
            }
            lines.push('');
          }

          if (report.directiveOverlaps?.length > 0) {
            lines.push(`### ${report.directiveOverlaps.length} overlapping directive(s)`);
            lines.push('');
          }

          if (report.defaultMatches?.length > 0) {
            lines.push(`### ${report.defaultMatches.length} redundant with Claude defaults`);
            lines.push('');
          }

          lines.push('---');
          lines.push('*Generated by [deadkit](https://github.com/JSK9999/deadkit)*');

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: lines.join('\n')
          });
      env:
        REPORT: ${{ steps.run.outputs.report }}
